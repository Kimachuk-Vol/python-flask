{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-10">

            <h2 class="display-6 text-center mb-4">
                <i class="bi bi-envelope-paper-fill me-2"></i>
                Зв'яжіться зі мною
            </h2>
            <p class="text-center text-muted mb-5">
                Будь ласка, заповніть форму нижче, і я відповім вам найближчим часом.
            </p>

            <form action="/submit-contact" method="POST">
                <div class="mb-3">
                    <label for="contactName" class="form-label">Ваше ім'я</label>
                    <input type="text" class="form-control" id="contactName" name="contact_name"
                        placeholder="Іван Петренко" required>
                </div>

                <div class="mb-3">
                    <label for="contactEmail" class="form-label">Електронна пошта</label>
                    <input type="email" class="form-control" id="contactEmail" name="contact_email"
                        placeholder="example@gmail.com" required>
                </div>

                <div class="mb-3">
                    <label for="contactPhone" class="form-label">Номер телефону (необов'язково)</label>
                    <input type="tel" class="form-control" id="contactPhone" name="contact_phone"
                        placeholder="+380 XX XXX XX XX">
                </div>

                <div class="mb-3">
                    <label for="contactReason" class="form-label">Причина звернення</label>
                    <select class="form-select" id="contactReason" name="contact_reason" required>
                        <option value="" selected disabled>Будь ласка, оберіть...</option>
                        <option value="job_offer">Пропозиція роботи</option>
                        <option value="cooperation">Запит на співпрацю</option>
                        <option value="feedback">Відгук про проєкт</option>
                        <option value="question">Загальне питання</option>
                        <option value="other">Інше</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="contactMessage" class="form-label">Ваше повідомлення</label>
                    <textarea class="form-control" id="contactMessage" name="contact_message" rows="5"
                        placeholder="Введіть ваше повідомлення тут..." required></textarea>
                </div>

                <div class="d-grid"> <button type="submit" class="btn btn-primary btn-lg">
                        Відправити
                        <i class="bi bi-send-fill ms-2"></i>
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
{% endblock %}
