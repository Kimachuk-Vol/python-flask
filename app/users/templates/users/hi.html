{% extends "base.html" %}

{% block title %} Greating Page {% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5 text-center">

                    <i class="bi bi-emoji-smile-fill display-2 text-primary mb-3"></i>

                    <h2 class="display-6">Hello, {{name}}!</h2>

                    {% if age %}
                    <p class="lead">You are {{age}} years old.</p>
                    {% else %}
                    <p class="lead text-muted">Age is unknown</p>
                    {% endif %}

                </div>
            </div>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted">Test other routes:</p>

                <a class="btn btn-primary" href="{{ url_for('users.greetings', name='John', age=30)}}">
                    <i class="bi bi-person-fill me-2"></i>Greet John
                </a>

                <a class="btn btn-secondary" href="{{ url_for('users.admin')}}">
                    <i class="bi bi-shield-lock-fill me-2"></i>Admin Area
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
