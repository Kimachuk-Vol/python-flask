{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row">
        <div class="col-lg-6 offset-lg-3">

            <div class="card shadow">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h1 class="text-danger" style="font-size: 4rem;">⚠️</h1>
                        <h2 class="h3 mb-3">Підтвердження видалення</h2>
                        <p class="fs-5">Ви справді хочете назавжди видалити цей пост?</p>
                    </div>

                    <div class="alert alert-warning" role="alert">
                        <h4 class="alert-heading">{{ post.title }}</h4>
                        <hr>
                        <p class="mb-0">Автор: {{ post.author }}</p>
                    </div>

                    <form method="POST" action="{{ url_for('posts.delete', id=post.id) }}">

                        <p class="text-muted text-center small">Цю дію неможливо буде скасувати.</p>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                            <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-secondary btn-lg">
                                Скасувати
                            </a>
                            <button type="submit" class="btn btn-danger btn-lg">
                                Так, видалити
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
