{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8">

            <h2 class="display-6 text-center mb-5 border-bottom pb-3">
                <i class="bi bi-collection-fill me-2"></i>
                Articles
            </h2>

            {% if products %}

            <ul class="list-group list-group-flush shadow-sm">

                {% for product in products %}

                <li class="list-group-item d-flex justify-content-between align-items-center p-3">

                    <a href="{{ url_for('product.detail_product', id=product['id']) }}"
                        class="fs-5 fw-bold text-decoration-none me-3">
                        {{ product["name"] }}
                    </a>

                    <span class="badge bg-secondary rounded-pill">
                        ID: {{ product["id"] }}
                    </span>

                </li>
                {% endfor %}

            </ul>

            {% else %}

            <div class="alert alert-info text-center" role="alert">
                <h4 class="alert-heading">Список порожній</h4>
                <p class="mb-0">Наразі немає доступних статей для відображення.</p>
            </div>

            {% endif %}

        </div>
    </div>
</div>
{% endblock %}
